[package]
name = "inferno-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
authors = ["Liam Dziga Douglas Giles"]
description = "A Rust machine-learning library with tensors, autograd, VAEs and Gaussian processes"
license = "MPL-2.0"
readme = "README.md"
documentation = "https://docs.rs/inferno-rs"
publish = true
include = [
    "/src/**", "/tests/**", "/examples/**", "/build.rs",
    "/proofs/README.md", "/proofs/scripts/*.py", "/proofs/scripts/*.sh", "/proofs/spec/**",
    "/proofs/lean/*.lean", "/proofs/lean/Pudding/**",
    "/proofs/lean/lakefile.toml", "/proofs/lean/lake-manifest.json", "/proofs/lean/lean-toolchain",
    "/Cargo.toml", "/Cargo.lock", "/LICENSE", "/README.md", "/CHANGELOG.md",
    "/CONTRIBUTING.md", "/SECURITY.md",
    "/docs/**", "/notebook/README.md", "/tools/**",
]

[lib]
name = "inferno"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
anyhow = "1"
ndarray = "0.15"
rand = "0.8"
rand_distr = "0.4"
wide = "1.6.1"
half = "2"
multiversion = "0.8.0"
safetensors = "0.8"
rand_chacha = "0.3"
sobol_burley = "0.5"
statrs = "0.17"
rayon = "1.10"
thiserror = "2.0.18"
serde_yaml = "0.9"
candle-core = "=0.11.1"
candle-nn = "=0.11.1"
tracing = "0.1"
cudarc = { version = "=0.19.10", optional = true }
cxx = { version = "1", optional = true }

[build-dependencies]
cxx-build = { version = "1", optional = true }

[features]
default = []
# Expose the native bridge API; CPU builds return CudaUnavailable.
torch-kernels = []
# Tensor and Candle CUDA support, requiring the CUDA toolkit.
cuda = ["dep:cudarc", "candle-core/cuda", "candle-nn/cuda"]
# Native C++ bridge additionally requires cuBLAS/cuDNN headers and libraries.
torch-kernels-cuda = ["torch-kernels", "cuda", "dep:cxx", "dep:cxx-build"]

[package.metadata.docs.rs]
no-default-features = true
